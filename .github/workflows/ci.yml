name: Office Studio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio_test
          POSTGRES_PASSWORD: studio_test_only
          POSTGRES_DB: maghrabi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_test -d maghrabi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://studio_test:studio_test_only@localhost:5432/maghrabi_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest backend/tests -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: docker build -t office-studio-check .
      - name: Verify actual Word-to-PDF preview in deployed image
        run: |
          docker run --rm --entrypoint python office-studio-check -c 'from app.content import Content; from app.exports import export_docx; from app.word_preview import render_word_preview; c=Content(title="تقرير تجريبي", language="ar", sections=[{"title":"المحور الأول","body":["هذا نص تجريبي للتحويل."],"notes":""},{"title":"المحور الثاني","body":["هذا نص إضافي."],"notes":""}]); pdf=render_word_preview(export_docx(c)); assert pdf.media_type=="application/pdf" and pdf.headers["x-preview-pages"].isdigit(); print("Real LibreOffice Word PDF preview rendered successfully")'
      - name: Verify detailed Arabic study, logo and table in real paginated PDF
        run: docker run --rm --entrypoint python office-studio-check /app/backend/tests/study_preview_smoke.py
