name: Office Studio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest backend/tests -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: docker build -t office-studio-check .
      - name: Verify actual Word-to-PDF preview in deployed image
        run: |
          docker run --rm --entrypoint python office-studio-check -c 'from app.content import Content; from app.exports import export_docx; from app.word_preview import render_word_preview; c=Content(title="تقرير تجريبي", language="ar", sections=[{"title":"المحور الأول","body":["هذا نص تجريبي للتحويل."],"notes":""},{"title":"المحور الثاني","body":["هذا نص إضافي."],"notes":""}]); pdf=render_word_preview(export_docx(c)); assert pdf.media_type=="application/pdf" and pdf.headers["x-preview-pages"].isdigit(); print("Real LibreOffice Word PDF preview rendered successfully")'
